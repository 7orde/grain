<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ece8df">
<title>grain</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&display=swap">
<style>
:root{color-scheme:light;--bg:#ece8df;--ink:#1a1815;--mid:#6a645b;--dim:#aaa398;--line:#d9d3c7;--accent:#8a3b1a;--art:#4a453d;--vig:rgba(70,50,30,.1);--gop:.07;--blend:multiply;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a0a09;--ink:#d4cfc5;--mid:#85807a;--dim:#4a4743;--line:#1c1b19;--accent:#c27a50;--art:#b9b4aa;--vig:rgba(0,0,0,.45);--gop:.045;--blend:screen}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "Newsreader",Georgia,serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}[hidden]{display:none!important}
.m,.tb,.seg button{font:11.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em}.mid{color:var(--mid)}
.wrap{max-width:1100px;margin:0 auto;padding:clamp(18px,3.5vh,34px) clamp(22px,4vw,48px) 36px;min-height:100svh;box-sizing:border-box;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(20px,4vh,40px)}
.top a:hover{color:var(--accent)}.top>div:last-child{display:flex;gap:18px;align-items:center}
#th{background:none;border:0;padding:0;color:var(--mid);cursor:pointer;display:inline-flex;line-height:0}#th:hover{color:var(--ink)}
#th svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tool{flex:1;display:grid;grid-template-columns:250px minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
@media (max-width:760px){.tool{grid-template-columns:1fr}}
.tctl{display:flex;flex-direction:column;gap:16px}.lbl{color:var(--mid);margin-bottom:6px;display:block}
.drop{border:1px dashed var(--dim);padding:26px 12px;text-align:center;color:var(--mid);cursor:pointer;transition:border-color .3s,color .3s}
.drop:hover,body.over .drop{border-color:var(--ink);color:var(--ink)}
.tb,.seg button{background:none;border:1px solid var(--line);color:var(--mid);padding:6px 10px;cursor:pointer;text-align:left;transition:color .25s,border-color .25s}
.tb:hover,.seg button:hover,.seg button.on,.tb.on{color:var(--ink);border-color:var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg.col{flex-direction:column}
.rg{display:block;color:var(--mid)}.rg span{display:flex;justify-content:space-between;margin-bottom:4px}.rg input{width:100%;accent-color:var(--art)}
.row2{display:flex;gap:6px;flex-wrap:wrap}
.stage{border:1px solid var(--line);min-height:300px;display:grid;place-items:center;padding:clamp(10px,2vw,22px)}
#tout{max-width:100%;max-height:70vh;width:auto;height:auto;image-rendering:pixelated;display:block}
#tpre{margin:0;white-space:pre;color:var(--art);font:10px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
#tstat{margin-top:10px}footer{margin-top:28px;display:flex;justify-content:space-between}
body::before{content:"";position:fixed;inset:0;z-index:49;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 50%,var(--vig))}
body::after{content:"";position:fixed;inset:-50%;z-index:50;pointer-events:none;background-image:var(--grain);background-size:128px;opacity:var(--gop);mix-blend-mode:var(--blend);animation:grain 1.2s steps(1) infinite}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-1.5%,1%)}50%{transform:translate(1%,-1.5%)}75%{transform:translate(-1%,-1%)}}
@media (prefers-reduced-motion:reduce){body::after{animation:none}}
:root.theming *,:root.theming *::before,:root.theming *::after{transition:background-color .8s ease,color .8s ease,border-color .8s ease!important}

details{border-top:1px solid var(--line);padding:10px 0}details summary{cursor:pointer;color:var(--mid);list-style:none}details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ "}details[open] summary::before{content:"− "}details[open] summary{margin-bottom:12px;color:var(--ink)}
.tin{display:flex;flex-direction:column;gap:14px}.tctl{gap:0;max-height:calc(100svh - 150px);overflow:auto;padding-right:8px}
@media (max-width:760px){.tctl{max-height:none}}
#terr{color:var(--accent);min-height:1.5em;margin-bottom:6px}
.stage{cursor:grab;touch-action:none;user-select:none}.stage.drag{cursor:grabbing}#torig{max-width:100%;display:block}
.hint{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div>grain</div><div class="m mid">image → dither / ascii / braille</div></div><div class="m"><button id="th" type="button"></button><a href="../portfolio/">← portfolio</a></div></div>
  <div class="tool">
    <div class="tctl">
      <details open><summary class="m">image</summary><div class="tin">
        <label class="drop m"><input type="file" accept="image/*" hidden id="file">drop, paste or click<br>to choose an image</label>
        <div class="row2"><button class="tb" id="tsample" type="button">sample</button><button class="tb" id="treset" type="button">reset</button><button class="tb" id="torigbtn" type="button">hold: original (o)</button></div>
        <label class="rg m"><span>zoom <output>1</output></span><input type="range" data-k="zoom" min="1" max="6" step=".05" value="1"></label>
        <div class="m hint">scroll to zoom, drag the preview to pan</div>
      </div></details>
      <details open><summary class="m">style</summary><div class="tin">
        <div><span class="lbl m">presets</span><div class="seg" id="pres"><button type="button" data-r="icarus">icarus</button><button type="button" data-r="hands">hands</button><button type="button" data-r="newsprint">newsprint</button><button type="button" data-r="terminal">terminal</button><button type="button" data-r="braille">braille</button></div></div>
        <div><span class="lbl m">mode <kbd class="m mid">1–5</kbd></span><div class="seg" id="modes"><button type="button" data-m="fs">floyd–steinberg</button><button type="button" data-m="atkinson">atkinson</button><button type="button" data-m="bayer">bayer</button><button type="button" data-m="ascii">ascii</button><button type="button" data-m="braille">braille</button></div></div>
        <div id="setrow"><span class="lbl m">characters</span><div class="seg" id="sets"><button type="button" data-s="minimal">minimal</button><button type="button" data-s="standard">standard</button><button type="button" data-s="detailed">detailed</button><button type="button" data-s="blocks">blocks</button><button type="button" data-s="dots">dots</button></div></div>
        <div><span class="lbl m">colour</span><div class="seg" id="pals"><button type="button" data-p="theme">theme</button><button type="button" data-p="paper">paper</button><button type="button" data-p="ink">ink</button><button type="button" data-p="phosphor">phosphor</button></div></div>
        <label class="rg m"><span>width <output>120</output></span><input type="range" data-k="w" min="30" max="320" step="1" value="120"></label>
      </div></details>
      <details><summary class="m">tone</summary><div class="tin">
        <div class="row2"><button class="tb" id="tauto" type="button">auto levels</button><button class="tb" id="tinv" type="button">invert (i)</button></div>
        <label class="rg m"><span>smooth <output>0</output></span><input type="range" data-k="blur" min="0" max="4" step="1" value="0"></label>
        <label class="rg m"><span>black point <output>0</output></span><input type="range" data-k="black" min="0" max=".5" step=".01" value="0"></label>
        <label class="rg m"><span>white point <output>1</output></span><input type="range" data-k="white" min=".5" max="1" step=".01" value="1"></label>
        <label class="rg m"><span>gamma <output>1</output></span><input type="range" data-k="g" min=".4" max="2.5" step=".05" value="1"></label>
        <label class="rg m"><span>density <output>1</output></span><input type="range" data-k="dens" min=".3" max="1.6" step=".05" value="1"></label>
        <label class="rg m"><span>edges <output>0</output></span><input type="range" data-k="edge" min="0" max="1" step=".05" value="0"></label>
      </div></details>
      <details open><summary class="m">export</summary><div class="tin">
        <div><span class="lbl m">scale</span><div class="seg" id="scales"><button type="button" data-x="2">2×</button><button type="button" data-x="4">4×</button><button type="button" data-x="8">8×</button></div></div>
        <div class="row2"><button class="tb" id="ttrans" type="button">transparent png</button></div>
        <div class="row2"><button class="tb" id="tsave" type="button">save png</button><button class="tb" id="tcopy" type="button">copy text</button></div>
      </div></details>
    </div>
    <div><div id="terr" class="m" role="alert"></div><div class="stage" id="stage"><canvas id="tout"></canvas><pre id="tpre" hidden></pre><canvas id="torig" hidden></canvas></div><div class="m mid" id="tstat"></div></div>
  </div>
  <footer class="m mid"><span>runs in your browser · nothing is uploaded</span><span>by liam</span></footer>
</div>
<script>
/*PURE*/
const ramps={minimal:' ·:+*#',standard:' .:-=+*#%@',detailed:" .'`^\",:;Il!i><~+_-?][}{1)(|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$",blocks:' ░▒▓█',dots:' ·•●'};
const BM={};function bayer(n){if(BM[n])return BM[n];let m=[[0]];while(m.length<n){const s=m.length,k=[],q=[[0,2],[3,1]];for(let y=0;y<s*2;y++){k[y]=[];for(let x=0;x<s*2;x++)k[y][x]=4*m[y&(s-1)|0][x&(s-1)|0]+q[y<s?0:1][x<s?0:1]}m=k}return BM[n]=m}
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
function box(a,w,h,r){if(r<1)return a;const t=new Float32Array(a.length),o=new Float32Array(a.length),n=2*r+1,X=x=>x<0?0:x>w-1?w-1:x,Y=y=>y<0?0:y>h-1?h-1:y;
  for(let y=0;y<h;y++){let s=0;for(let x=-r;x<=r;x++)s+=a[y*w+X(x)];for(let x=0;x<w;x++){t[y*w+x]=s/n;s+=a[y*w+X(x+r+1)]-a[y*w+X(x-r)]}}
  for(let x=0;x<w;x++){let s=0;for(let y=-r;y<=r;y++)s+=t[Y(y)*w+x];for(let y=0;y<h;y++){o[y*w+x]=s/n;s+=t[Y(y+r+1)*w+x]-t[Y(y-r)*w+x]}}return o}
function pct(a,p){const h=new Uint32Array(256);for(let i=0;i<a.length;i++)h[Math.min(255,a[i]*255|0)]++;let s=0;const t=a.length*p;for(let i=0;i<256;i++){s+=h[i];if(s>=t)return i/255}return 1}
function tone(L,w,h,P){const r=Math.round(P.blur),a=r>0?box(box(L,w,h,r),w,h,r):L,n=w*h,d=new Float32Array(n);
  let lo=0,hi=1;if(P.auto){lo=pct(a,.01);hi=Math.max(pct(a,.99),lo+.05)}
  const bp=P.black,wp=Math.max(P.white,bp+.05);
  for(let i=0;i<n;i++){let v=clamp((a[i]-lo)/(hi-lo));v=clamp((v-bp)/(wp-bp));d[i]=1-Math.pow(v,P.g)}
  if(P.edge>0){const s=box(L,w,h,1),loc=box(box(s,w,h,Math.max(3,w/8|0)),w,h,Math.max(3,w/8|0)),m=new Float32Array(n),I=(x,y)=>s[clamp(y,0,h-1)*w+clamp(x,0,w-1)];
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const gx=I(x+1,y-1)+2*I(x+1,y)+I(x+1,y+1)-I(x-1,y-1)-2*I(x-1,y)-I(x-1,y+1),gy=I(x-1,y+1)+2*I(x,y+1)+I(x+1,y+1)-I(x-1,y-1)-2*I(x,y-1)-I(x+1,y-1);m[y*w+x]=Math.hypot(gx,gy)}
    const sc=[...m].sort((p,q)=>p-q)[Math.floor(n*.95)]||1,E=P.edge;
    for(let i=0;i<n;i++){const e=clamp((m[i]/sc-.2)/.5),dk=clamp((loc[i]-s[i])/.25),line=clamp(e+dk*.2);d[i]=d[i]*(1-E)+line*E}}
  for(let i=0;i<n;i++){let v=P.inv?1-d[i]:d[i];d[i]=clamp(v*P.dens)}return d}
function dither(d,w,h,algo){const a=new Float32Array(w*h),o=new Uint8Array(w*h);for(let i=0;i<a.length;i++)a[i]=1-d[i];
  if(algo==='bayer'){const m=bayer(8);for(let y=0;y<h;y++)for(let x=0;x<w;x++)o[y*w+x]=a[y*w+x]<(m[y&7][x&7]+.5)/64?1:0;return o}
  const at=algo==='atkinson';
  for(let y=0;y<h;y++){const ltr=at||!(y&1);for(let k=0;k<w;k++){const x=ltr?k:w-1-k,i=y*w+x,old=a[i],nw=old>.5?1:0,e=old-nw,dx=ltr?1:-1;o[i]=nw?0:1;
    const add=(xx,yy,f)=>{if(xx>=0&&xx<w&&yy<h)a[yy*w+xx]+=e*f};
    if(at){const f=1/8;add(x+1,y,f);add(x+2,y,f);add(x-1,y+1,f);add(x,y+1,f);add(x+1,y+1,f);add(x,y+2,f)}
    else{add(x+dx,y,7/16);add(x-dx,y+1,3/16);add(x,y+1,5/16);add(x+dx,y+1,1/16)}}}
  return o}
function asciiText(d,w,h,ramp){const n=ramp.length-1,b=bayer(4);let s='';for(let y=0;y<h;y++){for(let x=0;x<w;x++){const v=d[y*w+x];s+=v<.04?ramp[0]:ramp[clamp(Math.round(v*n+((b[y&3][x&3]+.5)/16-.5)*.8),0,n)]}s+='\n'}return s}
function brailleText(o,W,cols,rows){const bit=[[1,8],[2,16],[4,32],[64,128]];let s='';for(let r=0;r<rows;r++){for(let c=0;c<cols;c++){let m=0;for(let y=0;y<4;y++)for(let x=0;x<2;x++)if(o[(r*4+y)*W+c*2+x])m|=bit[y][x];s+=String.fromCharCode(0x2800+m)}s+='\n'}return s}
/*END PURE*/

const $=s=>document.querySelector(s),root=document.documentElement,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEF={mode:'fs',set:'minimal',pal:'theme',w:120,blur:0,black:0,white:1,g:1,dens:1,edge:0,zoom:1,auto:true,inv:false,trans:false,scale:4,px:.5,py:.5};
const T={...DEF,src:null};try{Object.assign(T,JSON.parse(localStorage.getItem('dither.v2')||'{}'))}catch(e){}
const out=$('#tout'),pre=$('#tpre'),orig=$('#torig'),stage=$('#stage'),stat=$('#tstat');let last=null,view={w:1,h:1};
const PAL={paper:['#1a1815','#ece8df'],ink:['#d4cfc5','#0a0a09'],phosphor:['#7cfc9a','#07110a']};
const css=n=>getComputedStyle(root).getPropertyValue(n).trim(),cols=()=>T.pal==='theme'?[css('--art'),null]:PAL[T.pal];
const err=m=>{$('#terr').textContent=m||''};
const PRE={icarus:{mode:'fs',w:110,auto:true,black:0,white:.88,g:1.2,dens:.75,edge:0,blur:0},
 hands:{mode:'ascii',set:'minimal',w:170,auto:true,black:0,white:1,g:1,dens:1,edge:.85,blur:1},
 newsprint:{mode:'bayer',w:140,auto:true,black:0,white:1,g:1,dens:1,edge:0,blur:0},
 terminal:{mode:'ascii',set:'standard',pal:'phosphor',w:110,auto:true,black:0,white:1,g:1,dens:1,edge:0,blur:0},
 braille:{mode:'braille',w:90,auto:true,black:0,white:1,g:1,dens:1,edge:0,blur:0}};
/* film grain tile */
(()=>{const g=document.createElement('canvas');g.width=g.height=256;const c=g.getContext('2d'),d=c.createImageData(256,256);
for(let i=0;i<d.data.length;i+=4){const v=clamp(128+(Math.random()+Math.random()+Math.random()-1.5)*110,0,255);d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
c.putImageData(d,0,0);root.style.setProperty('--grain','url('+g.toDataURL()+')')})();
/* image in */
function sample(){const s=document.createElement('canvas');s.width=s.height=300;const c=s.getContext('2d'),g=c.createRadialGradient(130,120,10,150,150,160);
  g.addColorStop(0,'#fff');g.addColorStop(.6,'#777');g.addColorStop(1,'#111');c.fillStyle=g;c.fillRect(0,0,300,300);
  c.fillStyle='#000';c.beginPath();c.arc(210,205,55,0,7);c.fill();c.strokeStyle='#fff';c.lineWidth=6;c.beginPath();c.arc(150,150,100,.3,2.4);c.stroke();T.src=s;T.px=T.py=.5}
async function load(f){err('');if(!f)return;
  if(!/^image\//.test(f.type)||/hei[cf]/.test(f.type)){err('That file type is not supported. Try a PNG, JPG, WebP or GIF.');return}
  try{T.src=await createImageBitmap(f,{imageOrientation:'from-image'})}
  catch(e){try{T.src=await new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);ok(im)};im.onerror=no;im.src=u})}catch(x){err('Could not read that image. It may be corrupt.');return}}
  T.px=T.py=.5;schedule()}
function shrink(src,sx,sy,sw,sh,w,h){const k=Math.min(1,3000/sw);let c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw*k));c.height=Math.max(1,Math.round(sh*k));
  let g=c.getContext('2d');g.imageSmoothingQuality='high';g.drawImage(src,sx,sy,sw,sh,0,0,c.width,c.height);
  while(c.width/2>=w*1.01&&c.height/2>=h){const n=document.createElement('canvas');n.width=Math.ceil(c.width/2);n.height=Math.ceil(c.height/2);const ng=n.getContext('2d');ng.imageSmoothingQuality='high';ng.drawImage(c,0,0,n.width,n.height);c=n}
  const o=document.createElement('canvas');o.width=w;o.height=h;const og=o.getContext('2d');og.fillStyle='#fff';og.fillRect(0,0,w,h);og.imageSmoothingQuality='high';og.drawImage(c,0,0,w,h);return og.getImageData(0,0,w,h)}
function crop(){const sw=T.src.width||T.src.naturalWidth,sh=T.src.height||T.src.naturalHeight,cw=sw/T.zoom,ch=sh/T.zoom,cx=clamp(T.px*sw,cw/2,sw-cw/2),cy=clamp(T.py*sh,ch/2,sh-ch/2);return{sx:cx-cw/2,sy:cy-ch/2,cw,ch,sw,sh}}
let raf=0;function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;try{run()}catch(e){err('Something went wrong rendering that image. Try a smaller width.');console.error(e)}})}
function run(){if(!T.src)return;const{sx,sy,cw,ch}=crop(),m=T.mode,asc=m==='ascii',br=m==='braille',txt=asc||br,w=T.w,h=Math.max(1,Math.round(w*ch/cw*(txt?.6:1))),W=br?w*2:w,H=br?h*4:h;
  const px=shrink(T.src,sx,sy,cw,ch,W,H).data,L=new Float32Array(W*H);for(let i=0;i<L.length;i++)L[i]=(.299*px[i*4]+.587*px[i*4+1]+.114*px[i*4+2])/255;
  const d=tone(L,W,H,T),[fg,bg]=cols(),mw=stage.clientWidth-44,mh=innerHeight*.7;
  stage.style.background=bg||'transparent';out.hidden=txt;pre.hidden=!txt;orig.hidden=true;stat.textContent=w+' × '+h+' · '+m+(asc?' · '+T.set:'');
  $('#setrow').style.display=asc?'':'none';$('#tcopy').style.opacity=txt?1:.35;
  if(txt){const s=asc?asciiText(d,w,h,ramps[T.set]):brailleText(dither(d,W,H,'fs'),W,w,h),f=Math.max(2,Math.min(11,mw/(w*.6),mh/h));
    pre.textContent=s;pre.style.color=fg;pre.style.fontSize=f+'px';pre.style.lineHeight=f+'px';last={kind:'text',text:s,cols:w};view={w:w*f*.6,h:h*f};return}
  const o=dither(d,w,h,m==='bayer'?'bayer':m==='atkinson'?'atkinson':'fs'),k=Math.min(mw/w,mh/h),k2=k>=1?Math.floor(k):k;
  out.width=w;out.height=h;out.style.width=w*k2+'px';out.style.height=h*k2+'px';view={w:w*k2,h:h*k2};
  const g=out.getContext('2d');g.fillStyle=fg;g.beginPath();for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(o[y*w+x])g.rect(x,y,1,1);g.fill();last={kind:'px',w,h}}
function showOrig(on){if(!T.src||!last)return;if(!on){run();return}const{sx,sy,cw,ch}=crop();orig.width=Math.round(view.w*2);orig.height=Math.round(view.h*2);orig.style.width=view.w+'px';orig.style.height=view.h+'px';
  orig.getContext('2d').drawImage(T.src,sx,sy,cw,ch,0,0,orig.width,orig.height);out.hidden=pre.hidden=true;orig.hidden=false}
/* controls */
function sync(){document.querySelectorAll('input[data-k]').forEach(r=>{r.value=T[r.dataset.k];r.parentNode.querySelector('output').textContent=(+T[r.dataset.k]).toFixed(r.step&&r.step<1?2:0).replace(/\.?0+$/,'')||'0'});
  [['#modes','m','mode'],['#sets','s','set'],['#pals','p','pal'],['#scales','x','scale']].forEach(([s,a,k])=>document.querySelectorAll(s+' button').forEach(b=>b.classList.toggle('on',b.dataset[a]==T[k])));
  $('#tauto').classList.toggle('on',T.auto);$('#tinv').classList.toggle('on',T.inv);$('#ttrans').classList.toggle('on',T.trans)}
let sv=0;function changed(){sync();schedule();clearTimeout(sv);sv=setTimeout(()=>{try{const{src,...s}=T;localStorage.setItem('dither.v2',JSON.stringify(s))}catch(e){}},400)}
[['#modes','m','mode'],['#sets','s','set'],['#pals','p','pal'],['#scales','x','scale']].forEach(([s,a,k])=>document.querySelectorAll(s+' button').forEach(b=>b.addEventListener('click',()=>{T[k]=a==='x'?+b.dataset[a]:b.dataset[a];changed()})));
document.querySelectorAll('#pres button').forEach(b=>b.addEventListener('click',()=>{Object.assign(T,PRE[b.dataset.r]);changed()}));
document.querySelectorAll('input[data-k]').forEach(r=>r.addEventListener('input',()=>{T[r.dataset.k]=+r.value;changed()}));
const flip=k=>{T[k]=!T[k];changed()};$('#tauto').onclick=()=>flip('auto');$('#tinv').onclick=()=>flip('inv');$('#ttrans').onclick=()=>flip('trans');
$('#treset').onclick=()=>{const s=T.src;Object.assign(T,DEF);T.src=s;changed()};$('#tsample').onclick=()=>{sample();changed()};
$('#file').addEventListener('change',e=>load(e.target.files[0]));
const ob=$('#torigbtn');['pointerdown'].forEach(n=>ob.addEventListener(n,()=>showOrig(true)));['pointerup','pointerleave'].forEach(n=>ob.addEventListener(n,()=>showOrig(false)));
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('over')});addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('over')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('over');load(e.dataTransfer.files[0])});
addEventListener('paste',e=>{const f=[...(e.clipboardData?.files||[])].find(x=>x.type.startsWith('image/'));if(f)load(f)});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type!=='range'||e.metaKey||e.ctrlKey||e.repeat)return;const k=e.key,M=['fs','atkinson','bayer','ascii','braille'];
  if(k>='1'&&k<='5'){T.mode=M[k-1];changed()}else if(k==='i')flip('inv');else if(k==='o')showOrig(true)});
addEventListener('keyup',e=>{if(e.key==='o')showOrig(false)});
stage.addEventListener('wheel',e=>{if(!T.src)return;e.preventDefault();T.zoom=clamp(T.zoom*(e.deltaY<0?1.08:.93),1,6);changed()},{passive:false});
let dr=null;stage.addEventListener('pointerdown',e=>{if(!T.src)return;dr={x:e.clientX,y:e.clientY};stage.classList.add('drag');stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!dr)return;const c=crop(),dx=e.clientX-dr.x,dy=e.clientY-dr.y;dr={x:e.clientX,y:e.clientY};T.px-=dx/view.w*c.cw/c.sw;T.py-=dy/view.h*c.ch/c.sh;schedule()});
['pointerup','pointercancel'].forEach(n=>stage.addEventListener(n,()=>{dr=null;stage.classList.remove('drag')}));
/* export */
$('#tsave').onclick=()=>{if(!last)return;const s=T.scale,[fg,bg]=cols(),bgc=T.trans?null:(bg||css('--bg')),e=document.createElement('canvas');let c;
  if(last.kind==='px'){e.width=last.w*s;e.height=last.h*s;c=e.getContext('2d');if(bgc){c.fillStyle=bgc;c.fillRect(0,0,e.width,e.height)}c.imageSmoothingEnabled=false;c.drawImage(out,0,0,e.width,e.height)}
  else{const rows=last.text.trimEnd().split('\n'),fs=Math.round(5*s),f=fs+'px ui-monospace,Menlo,"DejaVu Sans Mono",monospace',t=document.createElement('canvas').getContext('2d');t.font=f;const cw=t.measureText('M').width;
    e.width=Math.ceil(last.cols*cw);e.height=rows.length*fs;c=e.getContext('2d');if(bgc){c.fillStyle=bgc;c.fillRect(0,0,e.width,e.height)}c.fillStyle=fg;c.font=f;c.textBaseline='top';rows.forEach((r,y)=>c.fillText(r,0,y*fs))}
  e.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='dither.png';a.click()})};
$('#tcopy').onclick=async e=>{const b=e.currentTarget;if(!last||last.kind!=='text')return;try{await navigator.clipboard.writeText(last.text);b.textContent='copied'}catch(x){b.textContent='copy failed'}setTimeout(()=>b.textContent='copy text',1400)};
addEventListener('resize',schedule);
/* theme: light by default, sun/moon, soft crossfade */
const th=$('#th'),SUN='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',MOON='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>';
function setTheme(t,save){root.dataset.theme=t;th.innerHTML=t==='dark'?SUN:MOON;th.setAttribute('aria-label',t==='dark'?'Switch to light mode':'Switch to dark mode');
  document.querySelector('meta[name=theme-color]').content=t==='dark'?'#0a0a09':'#ece8df';try{if(save)localStorage.setItem('theme',t)}catch(e){}schedule()}
let st='light';try{st=localStorage.getItem('theme')||'light'}catch(e){}
sample();sync();setTheme(st==='dark'?'dark':'light',false);
th.addEventListener('click',()=>{if(!reduce){root.classList.add('theming');void root.offsetWidth;clearTimeout(window._tt);window._tt=setTimeout(()=>root.classList.remove('theming'),900)}setTheme(root.dataset.theme==='dark'?'light':'dark',true)});
</script>
</body>
</html>
